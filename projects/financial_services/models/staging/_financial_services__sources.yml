version: 2

sources:
  - name: fs_raw
    description: >
      Raw financial services tables landed in Snowflake by Fivetran from the
      Google Cloud SQL for PostgreSQL `industry` database, schema
      `financial_services`. Nothing in this schema is edited by hand.

      Eight tables. Five of them (the risk_assess_* family) form a clean credit
      risk star and are the required path for this track. The other three are
      supporting or stretch material.

      Two of these tables carry personal data. `loan` carries a lot of it. See
      the PII notes on the individual tables, and models/staging/stg_loan.sql
      for what the project does about it.
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema') }}"

    tables:

      # =======================================================================
      # THE CREDIT RISK STAR (required path)
      # =======================================================================

      - name: risk_assess_customers
        description: >
          Customer dimension for the credit risk star. 1,000 rows, unique on
          customer_id.

          PII: `customer_name`. In this data set the values are persona labels
          ("Stable Prime Customer") rather than real names, but the column is
          named and positioned exactly like a name field would be, and it is
          treated as one. Staging does not pass it through.
        columns:
          - name: customer_id
            description: Primary key. Format CUST-nnnn.
          - name: customer_name
            description: >
              PII. Not exposed by staging. See stg_risk_assess_customers.sql.
          - name: segment
            description: Retail, Small Business, Corporate, High Net Worth or Institutional.
          - name: annual_income
            description: Reported annual income in USD.
          - name: income_bracket
            description: Low through Ultra-High.
          - name: credit_score
            description: Credit score, 303 to 850.
          - name: credit_score_range
            description: Poor, Fair, Good, Very Good or Excellent, with the band.
          - name: education_level
            description: Highest education level attained.
          - name: employment_sector
            description: Sector the customer works in.
          - name: years_of_credit_history
            description: Years since the customer's first credit line.
          - name: debt_to_income_ratio
            description: Total debt service over income, 0.1 to 0.6.
          - name: num_credit_accounts
            description: Open credit accounts.
          - name: num_delinquencies_last_2_years
            description: Delinquencies in the trailing 24 months.
          - name: is_homeowner
            description: >
              'True' or 'False' as a string, because the source Postgres column
              is `text`. Converted to a boolean in staging.
          - name: has_previous_bankruptcy
            description: >
              'True' or 'False' as a string, because the source Postgres column
              is `text`. Converted to a boolean in staging.
          - name: num_recent_inquiries
            description: Credit inquiries in the recent window.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      - name: risk_assess_financial_institutions
        description: >
          Institution dimension for the credit risk star. 20 rows, unique on
          institution_id. Small, conformed, and joined to by everything.
        columns:
          - name: institution_id
            description: Primary key. Format FI-nnnn or FI-Cnnn.
          - name: institution_name
            description: >
              Institution trading name. Not personal data, but commercially
              sensitive, so it is carried through with that noted rather than
              dropped.
          - name: institution_type
            description: Commercial Bank, Investment Bank, Credit Union, Asset Manager or Insurance Company.
          - name: institution_size
            description: Small, Medium, Large or Global.
          - name: region
            description: Northeast, Southeast, Midwest, Southwest, West or International.
          - name: assets_under_management_billions
            description: AUM in USD billions.
          - name: years_in_operation
            description: Years the institution has been trading.
          - name: risk_appetite
            description: >
              Risk appetite as a number from 0 to 1, not a category. Higher
              means more willing to take risk.
          - name: regulatory_rating
            description: Regulatory rating, 1 (best) to 5.
          - name: customer_base_millions
            description: Customers in millions.
          - name: digital_maturity_score
            description: Digital maturity, 1 to 10.
          - name: primary_risk_model
            description: Traditional Credit Model, Market Risk Model, Behavioral Analysis, Hybrid Approach or ML-Based Scoring.
          - name: avg_customer_lifetime_years
            description: Average length of a customer relationship in years.
          - name: fraud_loss_percentage
            description: Fraud losses as a percentage of volume.
          - name: default_rate_percentage
            description: Default rate as a percentage.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      - name: risk_assess_risk_profiles
        description: >
          The relationship fact: one row per customer and institution pair.
          2,948 rows, unique on (customer_id, institution_id). A customer can
          hold products at more than one institution.

          Watch the types. `collateral_quality_score`, `liquidity_ratio` and
          `projected_cash_flow_rating` all look numeric and are all `text` in
          the source, with empty strings where the value is unknown. Roughly
          two thirds of rows are empty on each. A plain cast() on any of them
          throws "Numeric value '' is not recognized".
        columns:
          - name: risk_profile_id
            description: Surrogate key from the source.
          - name: customer_id
            description: Foreign key to risk_assess_customers.
          - name: institution_id
            description: Foreign key to risk_assess_financial_institutions.
          - name: product_type
            description: Personal Loan, Business Loan, Mortgage, Credit Card, Investment Portfolio or Insurance Policy.
          - name: risk_pattern
            description: Steady-Low, Steady-Moderate, Improving, Cyclical, Volatile-Improving or Volatile-Deteriorating.
          - name: base_risk_score
            description: Baseline risk score for the relationship, 0.05 to 0.95.
          - name: total_exposure
            description: Total exposure in USD.
          - name: relationship_length_months
            description: Months the relationship has existed, 1 to 120.
          - name: products_held
            description: Number of products held, 1 to 5.
          - name: repayment_history_score
            description: Repayment history score, 1 to 10.
          - name: collateral_quality_score
            description: TEXT, not numeric. Empty on about 2,005 of 2,948 rows.
          - name: liquidity_ratio
            description: TEXT, not numeric. Empty on about 2,160 of 2,948 rows.
          - name: projected_cash_flow_rating
            description: TEXT, not numeric. Empty on about 2,054 of 2,948 rows.
          - name: recent_transaction_volatility
            description: Recent transaction volatility.
          - name: primary_risk_factors
            description: Comma-separated list of risk factor names.
          - name: risk_factor_weights
            description: >
              A Python-dict-shaped string, not valid JSON (single quotes). Left
              as text and kept out of the semantic layer on purpose.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      - name: risk_assess_monthly_assessments
        description: >
          The time-series fact: one row per customer, institution and month.
          106,128 rows, unique on (customer_id, institution_id, date), covering
          2022-01-01 to 2024-11-16.

          `risk_change_from_previous` is TEXT and is an empty string on the
          first assessment of every relationship, which is exactly 2,948 rows.
          Cast it without guarding and the model fails.
        columns:
          - name: assessment_id
            description: Surrogate key from the source.
          - name: customer_id
            description: Foreign key to risk_assess_customers.
          - name: institution_id
            description: Foreign key to risk_assess_financial_institutions.
          - name: date
            description: Assessment date. TEXT in the source, ISO YYYY-MM-DD.
          - name: month
            description: Month number, 1 to 12.
          - name: year
            description: Year, 2022 to 2024.
          - name: current_risk_score
            description: Risk score for the month, 0.01 to 0.99.
          - name: risk_level
            description: Very Low, Low, Moderate, High or Very High.
          - name: risk_change_from_previous
            description: >
              TEXT. Change in risk score since the previous month. Empty string
              on the first month of each relationship (2,948 rows).
          - name: fraud_probability
            description: Modelled fraud probability, 0.001 to 0.9.
          - name: is_anomaly
            description: >
              'True' or 'False' as a string, because the source Postgres column
              is `text`. Converted to a boolean in staging.
          - name: anomaly_type
            description: None, Fraud Alert, Unusual Transaction Pattern, Sudden Risk Change, Credit Report Change or Market Event Impact.
          - name: monthly_transaction_volume
            description: Transaction volume for the month in USD.
          - name: transaction_count
            description: Number of transactions in the month.
          - name: approval_recommendation
            description: Approve, Approve with Conditions, Approve with Strict Conditions or Deny.
          - name: approval_confidence
            description: Confidence in the recommendation, 0.5 to 0.99.
          - name: primary_explanation_factors
            description: Comma-separated list of factors behind the recommendation.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      - name: risk_assess_performance_metrics
        description: >
          Pre-aggregated performance fact, one row per customer, institution and
          product type. 2,948 rows, the same grain as risk_assess_risk_profiles.
        columns:
          - name: performance_id
            description: Surrogate key from the source.
          - name: customer_id
            description: Foreign key to risk_assess_customers.
          - name: institution_id
            description: Foreign key to risk_assess_financial_institutions.
          - name: product_type
            description: Product the metrics relate to.
          - name: avg_risk_score
            description: Average risk score over the period, 0.021 to 0.979.
          - name: risk_score_volatility
            description: Standard deviation of the risk score.
          - name: risk_trend
            description: Direction of travel in risk.
          - name: risk_trend_percentage
            description: Size of the risk trend as a percentage.
          - name: avg_fraud_probability
            description: Average modelled fraud probability.
          - name: anomaly_percentage
            description: Share of months flagged as anomalous.
          - name: approval_percentage
            description: Share of assessments recommending approval.
          - name: risk_assessment_accuracy
            description: Backtested accuracy of the risk model.
          - name: avg_monthly_transaction_volume
            description: Average monthly transaction volume in USD.
          - name: total_transaction_volume
            description: Total transaction volume in USD.
          - name: transaction_volatility
            description: Volatility of transaction volume.
          - name: total_exposure
            description: Total exposure in USD.
          - name: risk_adjusted_return
            description: Return adjusted for risk, 0.03 to 2.015.
          - name: customer_value_score
            description: Composite customer value score, 18 to 161.
          - name: customer_value_category
            description: Value tier derived from the score.
          - name: most_common_recommendation
            description: Modal approval recommendation for the relationship.
          - name: optimization_opportunity
            description: Free-text opportunity identified by the model.
          - name: optimization_priority
            description: Priority of the opportunity.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      # =======================================================================
      # THE PII TABLE (required path, governance beat)
      # =======================================================================

      - name: loan
        description: >
          LendingClub-style consumer credit applications. 39,717 rows, 118
          columns, unique on id.

          THIS IS THE PII TABLE. It carries, in this order of severity:

            social_security_number, ssn, ssnumber   three columns holding the
                                                    identical value on all
                                                    39,717 rows
            ssnumber1                               a fourth SSN-shaped column
                                                    holding a different value
            drivers_license, dl                     two columns holding the
                                                    identical value on all rows
            emp_title                               employer name, free text
            title, c_desc                           borrower free text, which
                                                    routinely contains names,
                                                    employers and life events
            zip_code                                first three digits
            c_url                                   a URL containing the loan id
            member_id                               a second person identifier

          None of these reach staging. Six redundant identity columns for two
          actual identifiers is what happens when three source systems get
          merged and nobody owns the schema. Finding and removing them is the
          governance beat of this track.

          Also watch the types: `int_rate` is '7.90%', `revol_util` is '28.30%',
          `issue_d` is 'Dec-11', and `pub_rec_bankruptcies` uses the string 'NA'
          for missing. All four are text and all four need handling.
        columns:
          - name: id
            description: Primary key, the LendingClub loan id.
          - name: funded_amnt
            description: Amount funded in USD, 500 to 35,000.
          - name: term
            description: "' 36 months' or ' 60 months', with leading whitespace."
          - name: int_rate
            description: Interest rate as a string with a percent sign, e.g. '7.90%'.
          - name: grade
            description: Credit grade A to G.
          - name: sub_grade
            description: Credit sub-grade, A1 to G5.
          - name: annual_inc
            description: Reported annual income in USD.
          - name: dti
            description: Debt-to-income ratio, 0 to 29.99.
          - name: home_ownership
            description: MORTGAGE, RENT, OWN, OTHER or NONE.
          - name: addr_state
            description: Two-letter US state code. 50 distinct values.
          - name: purpose
            description: Stated purpose of the loan. 14 distinct values.
          - name: loan_status
            description: Fully Paid, Current or Charged Off.
          - name: delinq_2yrs
            description: Delinquencies in the trailing 24 months.
          - name: pub_rec_bankruptcies
            description: Public record bankruptcies. Text, uses 'NA' for missing.
          - name: revol_util
            description: Revolving utilisation as a string with a percent sign.
          - name: verification_status
            description: Verified, Source Verified or Not Verified.
          - name: issue_d
            description: Issue month as 'Mon-YY', e.g. 'Dec-11'. 55 distinct values.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      # =======================================================================
      # STRETCH TABLES (optional, tagged 'stretch')
      # =======================================================================

      - name: fpr_records
        description: >
          Financial product recommendations and customer lifecycle. 751 rows.
          Optional stretch material.

          PII: `customer_name` and `customer_email`. Neither reaches staging.
        columns:
          - name: record_id
            description: Primary key, a UUID.
          - name: customer_id
            description: Customer identifier.
          - name: customer_name
            description: PII. Not exposed by staging.
          - name: customer_email
            description: PII. Not exposed by staging.
          - name: product_type
            description: The product the customer holds.
          - name: product_recommendation
            description: The product being recommended.
          - name: product_recommendation_status
            description: Accepted, Approved, Pending, In Progress, Rejected or Declined.
          - name: product_recommendation_date
            description: Date of the recommendation. TEXT in the source.
          - name: recommendation_score
            description: Model confidence in the recommendation, 0 to 1.
          - name: customer_lifecycle_stage
            description: One of ten lifecycle stages from Prospect to Churned.
          - name: customer_churn_probability
            description: Modelled churn probability, 0 to 1.
          - name: customer_satisfaction_score
            description: Satisfaction score.
          - name: account_balance
            description: Account balance in USD.
          - name: customer_segment
            description: Customer segment.
          - name: customer_transaction_count
            description: Transactions in the period.
          - name: customer_transaction_value
            description: Value of transactions in the period.
          - name: product_sales_amount
            description: Value of product sales in USD.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      - name: predict_term_deposit
        description: >
          The classic bank term-deposit marketing data set. 45,211 rows.
          Optional stretch material for a campaign-conversion story.

          `age` contains 999 as a sentinel for unknown on some rows. Averaging
          it without handling that is the kind of mistake that reaches a slide.
        columns:
          - name: id
            description: Primary key.
          - name: age
            description: Customer age. Uses 999 as a sentinel for unknown.
          - name: job
            description: Occupation category.
          - name: marital
            description: Marital status.
          - name: education
            description: Education level.
          - name: c_default
            description: Has credit in default, yes or no.
          - name: balance
            description: Average yearly balance in euros.
          - name: housing
            description: Has a housing loan, yes or no.
          - name: loan
            description: Has a personal loan, yes or no.
          - name: contact
            description: Contact channel.
          - name: day
            description: Day of month of last contact.
          - name: month
            description: Month of last contact, lowercase three-letter.
          - name: duration
            description: Duration of last contact in seconds.
          - name: campaign
            description: Contacts made during this campaign.
          - name: pdays
            description: Days since last contact on a previous campaign, -1 if none.
          - name: previous
            description: Contacts before this campaign.
          - name: poutcome
            description: Outcome of the previous campaign.
          - name: y
            description: >
              The target. 'yes' if the customer subscribed to a term deposit,
              otherwise 'no'. 5,289 of 45,211 subscribed, an 11.7% base rate.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

        # Freshness is deliberately left off across this source. The lab data is
        # static, so a freshness check would fail for everyone by design.
