# ---------------------------------------------------------------------------
# Financial services track
#
# This is the ONLY file you need to edit to point the project at your own data.
# Everything else in this project reads from the vars below.
#
# This is the flagship track. It is the same length as the other two, but the
# data is richer: a five-table credit-risk star, real PII to govern, and
# enforced contracts doing actual work.
# ---------------------------------------------------------------------------

name: 'hol_financial_services'
version: '1.0.0'
profile: 'snowflake_hol'

# Fusion-conformant: no config-version key, and a minimum version floor.
require-dbt-version: [">=1.9.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Fivetran can land identifiers in either case depending on destination settings.
# Leaving quoting off means dbt emits unquoted (Snowflake-uppercased) names,
# which is what a standard Fivetran Snowflake destination creates.
# If you hit "invalid identifier", see snowflake/GOTCHAS.md section 3.
quoting:
  database: false
  schema: false
  identifier: false

vars:
  # ---- TRACK IDENTITY (one obvious place per project) ---------------------
  track_key: 'financial_services'
  track_name: 'Financial services'
  track_description: >
    Credit risk assessment across a portfolio of customers and lending
    institutions: risk scores, fraud probability, exposure, approval decisions
    and the governance work needed to expose any of it to an AI agent.

  # ---- WHERE YOUR RAW DATA LIVES ------------------------------------------
  # Fivetran lands your data here. The database is created by the Snowflake
  # team ahead of the lab; see snowflake/reference_setup.sql.
  source_database: 'HOL_SNOWFLAKE_INDUSTRY'

  # >>> EDIT THIS ONE LINE <<<
  # Change to your own Fivetran destination schema, which is
  # <firstname>_<lastname>_financial_services (all lowercase).
  #
  # Having trouble? If your Fivetran sync is slow or you hit errors you cannot
  # resolve, set this back to 'hicham_bab_financial_services' to use the
  # instructor's data and keep going. Nothing else in the lab needs to change.
  source_schema: 'hicham_bab_financial_services'

models:
  hol_financial_services:
    +materialized: view
    staging:
      +tags: ['staging']
    intermediate:
      +tags: ['intermediate']
    marts:
      +materialized: table
      +tags: ['marts']
