version: 2

sources:
  - name: cpg_raw
    description: >
      Raw consumer packaged goods tables landed in Snowflake by Fivetran from the
      Google Cloud SQL for PostgreSQL `industry` database, schema
      `consumer_packaged_goods`. Nothing in this schema is edited by hand: it is
      whatever Fivetran wrote on the last sync.
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema') }}"

    tables:
      - name: cpg_records
        description: >
          One row per order line. Each row carries the order, the customer, the
          product and the inventory and pricing signals attached to that product
          at the time of the order. 750 rows.

          Grain: one row per `record_id`. In this data set `record_id`,
          `order_id`, `product_id` and `customer_id` are all distinct, so the
          table behaves like a wide, pre-joined fact.
        columns:
          - name: record_id
            description: Primary key of the raw feed. One per order line.
          - name: order_id
            description: Order identifier.
          - name: customer_id
            description: Customer identifier.
          - name: product_id
            description: Product identifier.
          - name: order_date
            description: >
              Date the order was placed. Lands as VARCHAR because the source
              Postgres column is `text`, formatted YYYY-MM-DD. Cast in staging.
          - name: order_total
            description: Order value in USD.
          - name: product_price
            description: Unit price of the product in USD.
          - name: inventory_level
            description: Units on hand for the product.
          - name: customer_segment
            description: High-Value, Medium-Value or Low-Value.
          - name: order_status
            description: Delivered, Shipped, Pending or Cancelled.
          - name: product_category
            description: Top-level merchandising category.
          - name: product_subcategory
            description: Merchandising subcategory.
          - name: customer_ltv
            description: Modelled customer lifetime value in USD.
          - name: order_frequency
            description: Orders placed by this customer in the trailing period.
          - name: average_order_value
            description: Modelled average order value for this customer, USD.
          - name: product_rating
            description: Average product rating, 1 to 5.
          - name: product_review_count
            description: Number of reviews behind the rating.
          - name: price_optimization_flag
            description: >
              'TRUE' or 'FALSE' as a string. The source Postgres column is
              `text`, so this is not a boolean until staging converts it.
          - name: price_elasticity
            description: Modelled price elasticity of demand.
          - name: demand_forecast
            description: Forecast units of demand for the next period.
          - name: inventory_turnover
            description: Inventory turns per period.
          - name: stockout_rate
            description: Share of periods the product was out of stock, 0 to 1.
          - name: overstock_rate
            description: Share of periods the product was overstocked, 0 to 1.
          - name: revenue_growth_rate
            description: Period-over-period revenue growth, as a ratio.
          - name: customer_satisfaction_rate
            description: Customer satisfaction score, 0 to 1.
          - name: price_optimization_date
            description: Date the pricing recommendation was produced (VARCHAR).
          - name: price_optimization_result
            description: Free-text outcome of the pricing action.
          - name: price_optimization_recommendation
            description: Free-text pricing recommendation.
          - name: _fivetran_synced
            description: >
              Timestamp Fivetran last wrote this row. Added by Fivetran, not
              present in the source. Kept in staging as a load-audit column.

        # Freshness is deliberately left off. The lab source is a static data
        # set, so a freshness check would fail for everyone by design. On a real
        # Fivetran feed you would enable this and point it at _fivetran_synced:
        #
        # loaded_at_field: _fivetran_synced
        # freshness:
        #   warn_after: {count: 12, period: hour}
        #   error_after: {count: 24, period: hour}
