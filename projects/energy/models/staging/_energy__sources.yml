version: 2

sources:
  - name: energy_raw
    description: >
      Raw energy tables landed in Snowflake by Fivetran from the Google Cloud SQL
      for PostgreSQL `industry` database, schema `energy`. Nothing in this schema
      is edited by hand: it is whatever Fivetran wrote on the last sync.
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema') }}"

    tables:

      - name: commodity_prices
        description: >
          Daily settlement prices for 23 traded commodities, one column per
          commodity. 5,898 rows covering 2000-01-03 to 2022-11-04.

          Grain: one row per date. This is a wide time series, which is fine for
          a spreadsheet and awkward for analytics, so the intermediate layer
          unpivots it into one row per date and commodity.

          Two real properties of this feed to know about. The row for
          2000-01-03 is entirely null except for the key, and `gasoline` only
          starts partway through the series, so it has about 1,480 fewer
          observations than the rest.
        columns:
          - name: id
            description: Row identifier, ascending with date.
          - name: date
            description: >
              Trade date. This one is a real DATE in the source, unlike most
              date columns in this lab.
          - name: natural_gas
            description: Henry Hub natural gas, USD per MMBtu.
          - name: wti_crude
            description: >
              West Texas Intermediate crude, USD per barrel. Goes negative on
              2020-04-20. That is not a data error, it is what the market did.
          - name: brent_crude
            description: Brent crude, USD per barrel.
          - name: low_sulphur_gas_oil
            description: Low sulphur gas oil, USD per tonne.
          - name: uls_diesel
            description: Ultra low sulphur diesel, USD cents per gallon.
          - name: gasoline
            description: >
              RBOB gasoline, USD cents per gallon. Sparse: the series starts
              later than the others.
          - name: gold
            description: Gold, USD per troy ounce.
          - name: silver
            description: Silver, USD per troy ounce.
          - name: copper
            description: Copper, USD per pound.
          - name: aluminium
            description: Aluminium, USD per tonne.
          - name: nickel
            description: Nickel, USD per tonne.
          - name: zinc
            description: Zinc, USD per tonne.
          - name: corn
            description: Corn, USD cents per bushel.
          - name: wheat
            description: Chicago wheat, USD cents per bushel.
          - name: hrw_wheat
            description: Hard red winter wheat, USD cents per bushel.
          - name: soybeans
            description: Soybeans, USD cents per bushel.
          - name: soybean_oil
            description: Soybean oil, USD cents per pound.
          - name: soybean_meal
            description: Soybean meal, USD per short ton.
          - name: sugar
            description: Sugar number 11, USD cents per pound.
          - name: coffee
            description: Arabica coffee, USD cents per pound.
          - name: cotton
            description: Cotton number 2, USD cents per pound.
          - name: live_cattle
            description: Live cattle, USD cents per pound.
          - name: lean_hogs
            description: Lean hogs, USD cents per pound.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      - name: fts_records
        description: >
          Field-service maintenance logs from the field technician system. One
          row per maintenance event, with downtime, failure rate, cost and an
          AI-generated summary of the technician's free-text log. 750 rows.

          Grain: one row per record_id.

          This is the system of record for maintenance. See `loglynx` below for
          why that matters.
        columns:
          - name: record_id
            description: Primary key, a UUID.
          - name: log_date
            description: >
              Date of the maintenance event. Lands as VARCHAR because the source
              Postgres column is `text`, formatted YYYY-MM-DD.
          - name: equipment_id
            description: Asset the event relates to.
          - name: technician_id
            description: Technician who performed the work.
          - name: customer_id
            description: Customer the asset belongs to.
          - name: erp_order_id
            description: Work order in the ERP system.
          - name: maintenance_type
            description: >
              Preventive, Predictive, Corrective, Condition-Based or
              Reliability-Centered Maintenance.
          - name: maintenance_status
            description: Completed, In Progress, Scheduled, Delayed or Cancelled.
          - name: log_description
            description: The technician's free-text note.
          - name: summarized_log
            description: AI-generated summary of the technician's note.
          - name: failure_rate
            description: Observed failure rate for the asset, 0 to 1.
          - name: maintenance_cost
            description: Cost of the maintenance event in USD.
          - name: downtime_hours
            description: Hours the asset was unavailable.
          - name: summarization_time_saved
            description: Analyst hours saved by the AI summary.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

      - name: loglynx
        description: >
          A second maintenance-log feed, from the LogLynx platform. Identical
          column-for-column to `fts_records`.

          IMPORTANT, and the reason this table is in the lab. In this data set
          LogLynx is not a second set of events, it is a mirror of the same 750
          events: every record_id in `fts_records` appears here, and no row
          differs on any column. Two systems are reporting the same physical
          maintenance work.

          If you union the two feeds and stop there, every energy metric doubles
          and nothing warns you. That is why
          `int_energy_maintenance_logs_unioned` unions and then de-duplicates on
          record_id, keeping the field technician system as the system of record.
          Real dual-source estates behave exactly like this after a platform
          migration that was never finished.
        columns:
          - name: record_id
            description: Primary key, a UUID. Overlaps 100% with fts_records.
          - name: log_date
            description: Date of the maintenance event, as VARCHAR.
          - name: equipment_id
            description: Asset the event relates to.
          - name: technician_id
            description: Technician who performed the work.
          - name: customer_id
            description: Customer the asset belongs to.
          - name: erp_order_id
            description: Work order in the ERP system.
          - name: maintenance_type
            description: Maintenance strategy applied.
          - name: maintenance_status
            description: Lifecycle state of the maintenance event.
          - name: log_description
            description: The technician's free-text note.
          - name: summarized_log
            description: AI-generated summary of the technician's note.
          - name: failure_rate
            description: Observed failure rate for the asset, 0 to 1.
          - name: maintenance_cost
            description: Cost of the maintenance event in USD.
          - name: downtime_hours
            description: Hours the asset was unavailable.
          - name: summarization_time_saved
            description: Analyst hours saved by the AI summary.
          - name: _fivetran_synced
            description: Timestamp Fivetran last wrote this row.

        # Freshness is deliberately left off across this source. The lab data is
        # static, so a freshness check would fail for everyone by design.
