# RENAME THIS FILE to _<track_key>__sources.yml
version: 2

sources:
  - name: <track_key>_raw
    description: >
      Raw <track name> tables landed in Snowflake by Fivetran from the Google
      Cloud SQL for PostgreSQL `industry` database, schema `<source_schema>`.
      Nothing in this schema is edited by hand.

      FILL ME: note anything unusual about the feed here. Row counts, PII,
      columns that are text but look numeric, date ranges that end earlier than
      people will assume. This description is read by dbt Wizard, so it is
      working documentation, not decoration.
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema') }}"

    tables:
      - name: <table_name>
        description: >
          FILL ME. State the GRAIN explicitly ("one row per ...") and the row
          count. Both save arguments later.
        columns:
          - name: <column>
            description: FILL ME.
          - name: _fivetran_synced
            description: >
              Timestamp Fivetran last wrote this row. Added by Fivetran, not
              present in the source.

        # Freshness is deliberately left off across this lab. The source data
        # is static, so a freshness check would fail for every attendee by
        # design. On a real feed you would enable it:
        #
        # loaded_at_field: _fivetran_synced
        # freshness:
        #   warn_after: {count: 12, period: hour}
        #   error_after: {count: 24, period: hour}
